<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Tracker</title>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/latest/maptiler-sdk.css" rel="stylesheet" />
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/latest/maptiler-sdk.umd.min.js"></script>
  <link rel="stylesheet" href="./style.css" />

</head>
<body>

<!-- I have made this webpage using apis from openweather website and also a api from Rapid Api called maptiler. I also took help from youtube videos and claude. -->


<h1> Weather Tracker</h1>

<div class="search-box">
  <input type="text" id="cityInput" placeholder="Enter city name..." />
  <button onclick="getWeather()">Search</button>
</div>


<p id="errorMsg" class="error" style="display:none;"></p>


<div id="weatherCard" style="display:none;">
  <h2 id="cityName"></h2>
  <p id="description"></p>
  <div class="big-temp" id="temp"></div>

  <div class="stats">
      <div class="stat">
        <span>💧</span>
        <p>Humidity</p>
        <strong id="humidity"></strong>
      </div>
      <div class="stat">
        <span>💨</span>
        <p>Wind Speed</p>
        <strong id="wind"></strong>
      </div>
      <div class="stat">
        <span>🌡️</span>
        <p>Feels Like</p>
        <strong id="feels"></strong>
      </div>
      <div class="stat">
        <span>🌧️</span>
        <p>Precipitation</p>
        <strong id="precipitation"></strong>
      </div>
    </div>
  </div>


  <div class="history-box">
    <h3>Recent Searches</h3>
    <div id="historyList"></div>
  </div>

<div class="map-box">
  <h3>📍 Map</h3>
  <div id="map"></div>
</div>

  <script src="./script.js"></script>
</body>
</html>
